<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WH3 Decision-Advisor Dashboard</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-2: #fafbfc;
    --border: #e2e5ea;
    --text: #1c2230;
    --muted: #6b7280;
    --accent: #3457d5;
    --ok-bg: #e7f6ec; --ok-fg: #1a7f37; --ok-dot: #23a55a;
    --bad-bg: #fdecec; --bad-fg: #b42318; --bad-dot: #e5484d;
    --warn-bg: #fff6e5; --warn-fg: #9a6700;
    --chip: #eef1f6;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --panel: #171b23; --panel-2: #1c212b; --border: #2a303c;
      --text: #e6e9ef; --muted: #9aa3b2; --accent: #6f8bff; --chip: #232a35;
      --ok-bg: #12291b; --ok-fg: #5fd08a; --ok-dot: #2ecc71;
      --bad-bg: #2c1517; --bad-fg: #ff7b72; --bad-dot: #ff5b5b;
      --warn-bg: #2a2210; --warn-fg: #e6c15a;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 18px 60px; }
  header.top {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  header.top h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .spacer { flex: 1 1 auto; }
  select, .pill {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 9px; font-size: 12.5px;
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .dot.live { background: var(--ok-dot); box-shadow: 0 0 0 0 rgba(35,165,90,.6); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(35,165,90,.5); } 70% { box-shadow: 0 0 0 6px rgba(35,165,90,0); } 100% { box-shadow: 0 0 0 0 rgba(35,165,90,0); } }

  section { margin-bottom: 22px; }
  h2.label { font-size: 11px; text-transform: uppercase; letter-spacing: .9px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; box-shadow: var(--shadow);
  }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .stat .v { font-size: 21px; font-weight: 650; margin-top: 3px; word-break: break-word; }
  .stat .v.small { font-size: 14px; font-weight: 600; }
  .stat .v.mono { font-family: var(--mono); }

  .health-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .health {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 11px 13px; box-shadow: var(--shadow);
  }
  .health .status-dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
  .health.ok .status-dot { background: var(--ok-dot); }
  .health.bad .status-dot { background: var(--bad-dot); }
  .health .h-body { min-width: 0; }
  .health .h-name { font-size: 12px; color: var(--muted); }
  .health .h-val { font-size: 15px; font-weight: 600; margin-top: 1px; }
  .health.ok .h-val { color: var(--ok-fg); }
  .health.bad .h-val { color: var(--bad-fg); }

  .menu-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
  .menu-head { display: flex; align-items: center; gap: 10px; padding: 12px 15px; border-bottom: 1px solid var(--border); background: var(--panel-2); flex-wrap: wrap; }
  .menu-head .title { font-size: 15px; font-weight: 650; }
  .menu-head .meta { color: var(--muted); font-size: 12px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .tag.scored { background: var(--ok-bg); color: var(--ok-fg); }
  .tag.raw { background: var(--warn-bg); color: var(--warn-fg); }
  .menu-body { padding: 6px 15px 14px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
  tr:last-child td { border-bottom: none; }
  .bar { position: relative; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; min-width: 60px; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 3px; }
  .top1 td { background: linear-gradient(90deg, rgba(52,87,213,.08), transparent); }
  .opt-name { font-weight: 600; }
  .opt-key { color: var(--muted); font-size: 11px; font-family: var(--mono); }
  .unavail { opacity: .5; }
  .raw-opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .raw-opt { font-size: 12px; padding: 3px 9px; border-radius: 7px; background: var(--chip); }
  .raw-opt.disabled { opacity: .45; }
  .empty { color: var(--muted); font-style: italic; padding: 8px 2px; }
  .notes { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .notes code { font-family: var(--mono); }
  footer { color: var(--muted); font-size: 11.5px; margin-top: 26px; }
  .err { background: var(--bad-bg); color: var(--bad-fg); border: 1px solid var(--bad-dot); border-radius: 10px; padding: 12px 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>WH3 Decision-Advisor</h1>
    <span class="sub"><span id="livedot" class="dot live"></span><span id="livetext">connecting…</span></span>
    <div class="spacer"></div>
    <label class="sub" for="runsel">run&nbsp;</label>
    <select id="runsel" title="Select run"></select>
  </header>

  <section id="advise-panel" style="margin:14px 0;">
    <h2 class="label">Ask the advisor (v0) — score a menu now</h2>
    <div id="advise-buttons">
      <button data-type="building">building</button>
      <button data-type="recruit">recruit</button>
      <button data-type="research">research</button>
      <button data-type="skills">skills</button>
      <button data-type="items">items</button>
      <button data-type="recruit_lord">lord recruit</button>
      <button data-type="occupation">occupation</button>
      <button data-type="captives">captives</button>
      <button data-type="pre_battle">pre-battle</button>
    </div>
    <div id="advise-result" class="card empty" style="margin-top:10px;">Press a menu button to score its options for the current run — the same v0 endpoint the launcher calls.</div>
  </section>

  <div id="content"><div class="empty">Loading…</div></div>

  <footer>
    Read-only dashboard &middot; polls <code>/api/state</code> every 1.5s &middot;
    no game / bus / recorder access &middot; source: <span id="rundir" class="opt-key"></span>
  </footer>
</div>

<script>
"use strict";
const POLL_MS = 1500;
let selectedRun = new URLSearchParams(location.search).get("run") || "";
let lastGood = 0;

function fmtInt(n) {
  if (n === null || n === undefined) return "—";
  if (typeof n === "number") return n.toLocaleString();
  return String(n);
}
function fmtAge(s) {
  if (s === null || s === undefined) return "—";
  if (s < 90) return s.toFixed(0) + "s";
  if (s < 3600) return (s/60).toFixed(1) + "m";
  return (s/3600).toFixed(1) + "h";
}
function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function prettyFaction(f) {
  if (!f) return "—";
  return String(f).replace(/^wh[0-9]?_(dlc[0-9]+_|main_)?/,"").replace(/_/g," ");
}
function scoreCell(v) {
  if (v === null || v === undefined) return '<td class="num">—</td>';
  const pct = Math.max(0, Math.min(1, v)) * 100;
  return '<td class="num">' + v.toFixed(3) + '</td>';
}

function statCard(k, v, opts) {
  opts = opts || {};
  const cls = "v" + (opts.small ? " small" : "") + (opts.mono ? " mono" : "");
  return '<div class="card stat"><div class="k">' + esc(k) + '</div>' +
         '<div class="' + cls + '">' + v + '</div></div>';
}

function renderCampaign(c) {
  if (!c) {
    return '<section><h2 class="label">Campaign</h2>' +
      '<div class="card empty">No human faction state row found yet in this run’s script_log.</div></section>';
  }
  let cards = "";
  cards += statCard("Turn", fmtInt(c.turn));
  cards += statCard("Faction", '<span title="'+esc(c.faction)+'">'+esc(prettyFaction(c.faction))+'</span>', {small:true});
  cards += statCard("Subculture", esc(prettyFaction(c.subculture)), {small:true});
  cards += statCard("Treasury", fmtInt(c.treasury), {mono:true});
  cards += statCard("Income", fmtInt(c.income) + (c.net_income!=null? ' <span class="opt-key">net '+fmtInt(c.net_income)+'</span>':''), {mono:true, small:true});
  cards += statCard("Regions", fmtInt(c.regions));
  cards += statCard("Power rank", c.rank!=null ? "#"+fmtInt(c.rank) : "—");
  cards += statCard("Vassals", c.num_vassals!=null ? fmtInt(c.num_vassals) : "—");
  return '<section><h2 class="label">Campaign</h2><div class="stat-grid">' + cards + '</div></section>';
}

function healthTile(name, ok, val) {
  return '<div class="health ' + (ok ? "ok" : "bad") + '">' +
    '<span class="status-dot"></span>' +
    '<div class="h-body"><div class="h-name">' + esc(name) + '</div>' +
    '<div class="h-val">' + val + '</div></div></div>';
}
function renderHealth(h) {
  if (!h) return "";
  let t = "";
  t += healthTile("Recorder heartbeat", h.heartbeat_ok, fmtAge(h.heartbeat_age_sec) + " ago");
  t += healthTile("Decisions captured", h.decisions_ok, fmtInt(h.decisions_captured) + " menu(s)");
  t += healthTile("Shots stream", h.shots_ok, fmtAge(h.shots_age_sec) + " · " + fmtInt(h.shots_count));
  t += healthTile("Events stream", h.events_ok, fmtAge(h.events_age_sec) + " ago");
  t += healthTile("UI components", h.ui_components_ok, fmtAge(h.ui_components_age_sec) + " ago");
  const busVal = h.last_bus_status ? h.last_bus_status : (h.last_status || "—");
  const busOk = (h.last_bus_status || h.last_status) !== "bus_unavailable";
  t += healthTile("Bus status", busOk, esc(busVal));
  return '<section><h2 class="label">Health</h2><div class="health-grid">' + t + '</div></section>';
}

function renderScoredTable(s) {
  if (!s || !s.options || !s.options.length) return "";
  let rows = "";
  s.options.forEach(function(o, i) {
    const pct = (o.combined!=null ? Math.max(0,Math.min(1,o.combined))*100 : 0);
    rows += '<tr class="' + (i===0?"top1":"") + (o.available===false?" unavail":"") + '">' +
      '<td><span class="opt-name">' + esc(o.name || o.key) + '</span>' +
        (o.type? ' <span class="opt-key">'+esc(o.type)+'</span>':'') +
        (o.available===false? ' <span class="tag raw">unavailable</span>':'') + '</td>' +
      '<td style="width:120px"><div class="bar"><i style="width:'+pct.toFixed(0)+'%"></i></div></td>' +
      scoreCell(o.combined) + scoreCell(o.exploit) + scoreCell(o.explore) + '</tr>';
  });
  return '<div class="menu-body"><table><thead><tr>' +
    '<th>Option</th><th></th><th class="num">Combined</th><th class="num">Exploit</th><th class="num">Explore</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function renderRawOptions(opts) {
  if (!opts || !opts.length) return '<div class="menu-body empty">No option labels captured.</div>';
  let chips = "";
  opts.forEach(function(o) {
    const label = o.label || o.name || o.key || o.id || "?";
    const dis = (o.clickable===false || o.state==="disabled") ? " disabled" : "";
    chips += '<span class="raw-opt' + dis + '">' + esc(label) + '</span>';
  });
  return '<div class="menu-body"><div class="raw-opts">' + chips + '</div></div>';
}

function renderMenus(menus) {
  let inner = "";
  if (!menus || !menus.length) {
    inner = '<div class="card empty">No menu decisions captured in this run yet.</div>';
  } else {
    menus.forEach(function(m) {
      const scored = m.scored && m.scored.options && m.scored.options.length;
      // Prefer the server's note (e.g. "model pending" / "no recent match") over
      // a generic "raw options" tag, so an unscored panel never looks like a
      // wrong table. Raw captured options still render below for context.
      const tag = scored
        ? '<span class="tag scored">scored table</span>'
        : '<span class="tag raw">' + esc(m.scored_note || "raw options") + '</span>';
      const campLabel = m.campaign ? ' · ' + esc(prettyFaction(m.campaign)) : '';
      inner += '<div class="menu-card">' +
        '<div class="menu-head">' +
          '<span class="title">' + esc(m.panel || "menu") + ' menu received</span>' +
          tag +
          '<span class="meta">' + fmtInt(m.n) + ' option(s) · t=' + esc(m.t) + campLabel + '</span>' +
        '</div>' +
        (scored ? renderScoredTable(m.scored) : renderRawOptions(m.options)) +
      '</div>';
    });
  }
  return '<section><h2 class="label">Menus</h2>' + inner + '</section>';
}

function renderNotes(state) {
  const n = state.notes || [];
  if (!n.length && state.advisor_present) return "";
  let s = "";
  if (!state.advisor_present) s += '<span>advisor.jsonl not present in this run — showing raw captured options only. </span>';
  if (n.length) s += 'notes: ' + n.map(x => '<code>'+esc(x)+'</code>').join(" &middot; ");
  return s ? '<div class="notes">' + s + '</div>' : "";
}

function populateRuns(runs) {
  const sel = document.getElementById("runsel");
  if (!runs) return;
  const cur = selectedRun;
  let html = "";
  runs.forEach(function(r) {
    const label = r.id + " (" + fmtAge(r.fresh_age_sec) + ")";
    html += '<option value="' + esc(r.id) + '">' + esc(label) + '</option>';
  });
  sel.innerHTML = html;
  // Reflect which run is actually being shown.
  if (window.__activeRun) sel.value = window.__activeRun;
  else if (cur) sel.value = cur;
}

function render(state) {
  const el = document.getElementById("content");
  if (!state.ok) {
    el.innerHTML = '<div class="err">API error: ' + esc(state.error || "unknown") + '</div>';
    populateRuns(state.runs);
    return;
  }
  window.__activeRun = state.run ? state.run.id : "";
  document.getElementById("rundir").textContent = state.run ? state.run.dir : "";
  let html = "";
  html += renderCampaign(state.campaign);
  html += renderHealth(state.health);
  html += renderMenus(state.menus);
  html += renderNotes(state);
  el.innerHTML = html;
  populateRuns(state.runs);
}

async function poll() {
  try {
    const q = window.__activeRun || selectedRun;
    const url = "/api/state" + (q ? "?run=" + encodeURIComponent(q) : "");
    const r = await fetch(url, { cache: "no-store" });
    const state = await r.json();
    render(state);
    lastGood = Date.now();
    setLive(true, state);
  } catch (e) {
    setLive(false, null);
  }
}

function setLive(ok, state) {
  const dot = document.getElementById("livedot");
  const txt = document.getElementById("livetext");
  if (ok) {
    dot.className = "dot live";
    const t = state && state.run ? state.run.id : "";
    txt.textContent = "live · " + t;
  } else {
    dot.className = "dot";
    dot.style.background = "var(--bad-dot)";
    txt.textContent = "disconnected (retrying)";
  }
}

document.getElementById("runsel").addEventListener("change", function() {
  selectedRun = this.value;
  window.__activeRun = this.value;
  const u = new URL(location.href);
  u.searchParams.set("run", this.value);
  history.replaceState(null, "", u.toString());
  poll();
});

async function advise(type) {
  const box = document.getElementById("advise-result");
  box.className = "card"; box.innerHTML = "scoring <b>" + esc(type) + "</b>…";
  try {
    const q = window.__activeRun || selectedRun;
    const url = "/api/advise?type=" + encodeURIComponent(type) + (q ? "&run=" + encodeURIComponent(q) : "");
    const r = await fetch(url, { cache: "no-store" });
    const d = await r.json();
    if (d.error) { box.className = "err"; box.innerHTML = "advise error: " + esc(d.error); return; }
    if (!d.options || !d.n) {
      box.className = "card empty";
      box.innerHTML = "<b>" + esc(type) + "</b>: " + esc(d.note || "no options (menu not open / not captured)");
      return;
    }
    box.className = "card";
    box.innerHTML = '<div class="opt-key" style="margin-bottom:6px"><b>' + esc(type) + '</b> &middot; ' +
      esc(prettyFaction(d.faction)) + ' &middot; top of ' + d.n + ' by combined</div>' +
      renderScoredTable({ options: d.options });
  } catch (e) { box.className = "err"; box.innerHTML = "advise failed: " + esc(e); }
}
document.getElementById("advise-buttons").addEventListener("click", function(e) {
  if (e.target && e.target.tagName === "BUTTON") advise(e.target.getAttribute("data-type"));
});

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
